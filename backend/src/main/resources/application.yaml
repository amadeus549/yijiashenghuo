server:
  port: 8083
spring:
  application:
    name: yijia
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/yijia?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: 423656514
  redis:
    # 默认连虚拟机里的 Redis；本机跑或换了机器，用环境变量覆盖即可，不用改代码：
    #   REDIS_HOST=127.0.0.1 或启动参数 --spring.redis.host=127.0.0.1
    host: ${REDIS_HOST:192.168.66.129}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:423656514}
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
mybatis-plus:
  type-aliases-package: com.yijia.entity # 别名扫描包
logging:
  level:
    com.yijia: debug

# 图片上传目录：默认写到项目下的 uploads/，部署时指向 Nginx 的 imgs 目录即可
yijia:
  upload-dir: ${YIJIA_UPLOAD_DIR:./uploads/}
