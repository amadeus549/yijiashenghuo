<!DOCTYPE html>
<html lang="en">

<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
  <title>我的订单 · 逸家生活</title>
  <link rel="stylesheet" href="./css/element.css">
  <link href="./css/main.css" rel="stylesheet">
  <style type="text/css">
    body {
      background: #f5f5f5;
    }

    .order-header {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      height: 44px;
      padding: 0 12px;
      background: #fff;
      border-bottom: 1px solid #f0f0f0;
    }

    .order-header .back {
      width: 28px;
      font-size: 18px;
      color: #333;
      cursor: pointer;
    }

    .order-header .title {
      flex: 1;
      text-align: center;
      font-size: 16px;
      font-weight: 600;
      margin-right: 28px;
    }

    .order-list {
      padding: 10px 12px 80px;
    }

    .order-card {
      background: #fff;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, .04);
    }

    .order-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: #666;
      padding-bottom: 10px;
      border-bottom: 1px solid #f5f5f5;
    }

    .order-status {
      font-size: 13px;
      font-weight: 600;
    }

    .status-wait { color: #ff6633; }
    .status-paid { color: #52c41a; }
    .status-cancel { color: #b1b1b1; }

    .order-body {
      display: flex;
      padding: 12px 0;
    }

    .order-img {
      width: 72px;
      height: 72px;
      border-radius: 8px;
      overflow: hidden;
      background: #f5f5f5;
      flex-shrink: 0;
    }

    .order-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .order-info {
      flex: 1;
      padding-left: 10px;
      min-width: 0;
    }

    .order-title {
      font-size: 14px;
      color: #333;
      line-height: 19px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .order-provider {
      font-size: 12px;
      color: #999;
      padding-top: 6px;
    }

    .order-foot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 10px;
      border-top: 1px solid #f5f5f5;
    }

    .order-price {
      font-size: 16px;
      color: #ff6633;
      font-weight: 600;
    }

    .order-price small {
      font-size: 12px;
      font-weight: normal;
    }

    .order-actions {
      display: flex;
      gap: 8px;
    }

    .order-actions button {
      height: 30px;
      padding: 0 14px;
      border-radius: 15px;
      font-size: 13px;
      border: 1px solid #ddd;
      background: #fff;
      color: #666;
      cursor: pointer;
    }

    .order-actions button.primary {
      background: #ff6633;
      border-color: #ff6633;
      color: #fff;
    }

    .order-actions button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .order-empty {
      padding: 80px 0;
      text-align: center;
      color: #b1b1b1;
      font-size: 14px;
    }

    .order-empty i {
      display: block;
      font-size: 42px;
      margin-bottom: 12px;
      color: #dcdcdc;
    }

    .load-more {
      text-align: center;
      padding: 14px 0;
      color: #82848a;
      font-size: 13px;
      cursor: pointer;
    }

    .order-time {
      font-size: 12px;
      color: #b1b1b1;
      padding-top: 8px;
    }
  </style>
</head>

<body>
<div id="app">
  <div class="order-header">
    <div class="back" @click="goBack"><i class="el-icon-arrow-left"></i></div>
    <div class="title">我的订单</div>
  </div>

  <div class="order-list">
    <div class="order-empty" v-if="!loading && orders.length === 0">
      <i class="el-icon-tickets"></i>
      还没有订单，去首页看看服务吧
    </div>

    <div class="order-card" v-for="o in orders" :key="o.id">
      <div class="order-top">
        <span>{{o.providerName || '逸家生活'}}</span>
        <span class="order-status" :class="statusClass(o.status)">{{statusText(o.status)}}</span>
      </div>
      <div class="order-body" @click="toProvider(o)">
        <div class="order-img">
          <img :src="o.image || '/imgs/icons/icon1.jpg'" alt="">
        </div>
        <div class="order-info">
          <div class="order-title">{{o.title || '服务套餐'}}</div>
          <div class="order-provider">订单号 {{o.id}}</div>
        </div>
      </div>
      <div class="order-foot">
        <div class="order-price"><small>¥</small>{{(o.payValue / 100).toFixed(2)}}</div>
        <div class="order-actions">
          <button v-if="o.cancelable" @click="cancel(o)">取消订单</button>
          <button v-if="o.cancelable" class="primary" :disabled="busyId === o.id" @click="pay(o)">
            {{busyId === o.id ? '处理中' : '去支付'}}
          </button>
          <button v-if="o.status === 2" disabled>已支付</button>
        </div>
      </div>
      <div class="order-time">下单时间 {{formatTime(o.createTime)}}</div>
    </div>

    <div class="load-more" v-if="hasMore" @click="loadMore">加载更多</div>
    <div class="load-more" v-else-if="orders.length">没有更多了</div>
  </div>
</div>

<script src="./js/vue.js"></script>
<script src="./js/axios.min.js"></script>
<script src="./js/element.js"></script>
<script src="./js/common.js"></script>
<script>
  if (!sessionStorage.getItem("token")) {
    location.href = "/login.html";
  }

  new Vue({
    el: "#app",
    data: {
      orders: [],
      current: 0,
      total: 0,
      loading: false,
      busyId: null
    },
    computed: {
      hasMore() {
        return this.orders.length < this.total;
      }
    },
    created() {
      this.loadMore();
    },
    methods: {
      goBack() {
        history.back();
      },
      statusText(status) {
        return {1: "待支付", 2: "已支付", 4: "已取消"}[status] || "未知";
      },
      statusClass(status) {
        return {1: "status-wait", 2: "status-paid", 4: "status-cancel"}[status] || "";
      },
      formatTime(t) {
        if (!t) return "";
        const d = new Date(t);
        const p = n => (n < 10 ? "0" + n : n);
        return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate())
          + " " + p(d.getHours()) + ":" + p(d.getMinutes());
      },
      loadMore() {
        if (this.loading) return;
        this.loading = true;
        this.current += 1;
        axios.get("/deal-order/list", {params: {current: this.current}})
          .then(res => {
            this.orders = this.orders.concat(res.data || []);
            this.total = res.total || 0;
            this.loading = false;
          })
          .catch(err => {
            this.loading = false;
            this.$message.error(err);
          });
      },
      pay(o) {
        if (this.busyId) return;
        this.busyId = o.id;
        axios.post("/deal-order/" + o.id + "/pay")
          .then(() => {
            this.$message.success("支付成功");
            this.busyId = null;
            this.refresh();
          })
          .catch(err => {
            this.busyId = null;
            this.$message.error(err);
          });
      },
      cancel(o) {
        this.$confirm("取消后库存会释放，确定取消这个订单吗？", "提示", {type: "warning"})
          .then(() => {
            axios.post("/deal-order/" + o.id + "/cancel")
              .then(() => {
                this.$message.success("已取消");
                this.refresh();
              })
              .catch(this.$message.error);
          })
          .catch(() => {});
      },
      refresh() {
        this.orders = [];
        this.current = 0;
        this.total = 0;
        this.loadMore();
      },
      toProvider(o) {
        if (o.providerId) {
          location.href = "/provider-detail.html?id=" + o.providerId;
        }
      }
    }
  });
</script>
</body>

</html>
